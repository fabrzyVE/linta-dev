{% if module.phone_number %}
<a
  href="tel:{{ module.phone_number | escape }}"
  class="floating-call-cta btn callrail-phone"
  aria-label="{{ module.aria_label }}"
>
  <svg
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="currentColor"
    aria-hidden="true"
  >
    <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V21a1 1 0 01-1 1C10.07 22 2 13.93 2 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.59a1 1 0 01-.25 1.01l-2.2 2.19z"/>
  </svg>

  <!-- This is the swap target -->
  <span class="callrail-number">
    {{ module.phone_number }}
  </span>
</a>
{% endif %}
