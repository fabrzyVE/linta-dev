<!--
  templateType: "none"
  isAvailableForNewContent: false
-->
{# Module: Linta Hero - Design reference: index.html #}
<div class="hero-image">
  <div class="hero-image-circle">
    {% if module.hero_image.src %}
      <img src="{{ module.hero_image.src }}" alt="{{ module.hero_image.alt or 'Roof by Linta Roofing' }}" />
    {% else %}
      <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&q=80" alt="Aerial view of beach house with new roof by Linta Roofing" />
    {% endif %}
  </div>
</div>
<section class="hero">
  <div class="container hero-grid">
    <div class="hero-content">
      <h1>{{ module.headline }}</h1>
      <p class="hero-text">{{ module.hero_text }}</p>
      <div class="google-badge">
        <span class="google-badge-icon"><i class="fab fa-google"></i></span>
        <div class="google-badge-stars">
          <div class="google-badge-rating">
            <strong>{{ module.google_rating }}</strong>
            <span class="stars">★★★★★</span>
          </div>
          <small>{{ module.review_count }}</small>
        </div>
      </div>
    </div>
  </div>
  {% if module.form_id %}
  <div class="hero-form-wrapper">
    <div class="hero-form">
      {% hubspot_form id=module.form_id %}
    </div>
  </div>
  {% endif %}
</section>
<section class="curved"></section>
