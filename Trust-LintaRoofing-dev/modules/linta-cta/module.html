{# Module: Linta CTA - Design reference: index.html #}
<section class="cta" id="contact">
  <div class="container">
    <div class="cta-box">
      <div class="cta-curve" aria-hidden="true"></div>
      <h2 class="cta-title">Schedule Your Roof <span>Inspection</span> Today</h2>
      <p class="cta-text">{{ module.text }}</p>
      <a href="{{ module.button_link.url|default('#contact') }}" class="btn btn-yellow cta-btn">{{ module.button_text }}</a>
    </div>
  </div>
</section>
